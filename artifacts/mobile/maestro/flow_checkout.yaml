appId: com.bardec.app
# ─────────────────────────────────────────────────────────────────
# FLOW 3 — Checkout complet (Carte Bancaire, démo)
# ⚠ AUDIT : checkout.tsx ne fait AUCUN INSERT Supabase (0 occurence)
#   → Aucune ligne dans orders ne sera créée dans Supabase
# ─────────────────────────────────────────────────────────────────
name: "BARDEC · Checkout complet"
tags:
  - checkout
  - no-supabase-write

env:
  FULL_NAME: "Maestro Test User"
  ADDRESS: "15 Avenue Test BARDEC"
  CITY: "Dakar"
  ZIP: "12345"
  COUNTRY: "Sénégal"
  PHONE: "+221 77 000 00 00"

---

- launchApp:
    clearState: false

# S'assurer d'être sur le panier (non vide)
- tapOn: "Panier"
- assertNotVisible: "Panier vide"

# Lancer le checkout
- tapOn: "Commander"

# ── Étape 1 : Adresse ────────────────────────────────────────────
- assertVisible: "Adresse"

- tapOn:
    text: "Nom complet *"
- eraseText: 50
- inputText: ${FULL_NAME}

- tapOn:
    text: "Adresse *"
- eraseText: 50
- inputText: ${ADDRESS}

- tapOn:
    text: "Ville *"
- eraseText: 50
- inputText: ${CITY}

- tapOn:
    text: "Code postal"
- eraseText: 20
- inputText: ${ZIP}

- tapOn:
    text: "Pays"
- eraseText: 20
- inputText: ${COUNTRY}

- tapOn:
    text: "Téléphone"
- eraseText: 20
- inputText: ${PHONE}

- tapOn: "Continuer"

# ── Étape 2 : Livraison ──────────────────────────────────────────
- assertVisible: "Livraison"
- tapOn: "Standard (Gratuit)"
- tapOn: "Continuer"

# ── Étape 3 : Paiement ───────────────────────────────────────────
- assertVisible: "Paiement"
- tapOn: "Carte Bancaire"
- tapOn: "Continuer"

# ── Étape 4 : Confirmation ───────────────────────────────────────
- assertVisible: "Confirmation"
- tapOn: "Passer la Commande"

# Écran de succès
- assertVisible: "Merci!"
- assertVisible: "Votre commande a été confirmée."

# Retour à l'accueil
- tapOn: "Retour à l'accueil"
- assertVisible: "Accueil"
