appId: com.bardec.app
# ─────────────────────────────────────────────────────────────────
# FLOW 2 — Navigation accueil → recherche → fiche produit → panier
# Produits : MOCK_PRODUCTS (noms en anglais, filtrés localement)
# ─────────────────────────────────────────────────────────────────
name: "BARDEC · Parcourir & Panier"
tags:
  - catalog
  - cart
  - local-mock

env:
  SEARCH_QUERY: "Coffee"    # correspond à "Arabica Green Coffee Beans" dans MOCK_PRODUCTS

---

- launchApp:
    clearState: false

# ── Vérifier que l'accueil se charge ────────────────────────────
- assertVisible: "Accueil"
- assertVisible: "Produits Tendances"

# ── Aller sur l'onglet Recherche et taper la requête ────────────
- tapOn: "Recherche"
- tapOn:
    text: "Rechercher produits, vendeurs..."
- inputText: ${SEARCH_QUERY}

# L'onglet Recherche doit lister des résultats (MOCK_PRODUCTS filtrés)
- assertVisible: "Recherche"

# Taper sur le premier bouton "Ajouter au Panier" visible
- tapOn: "Ajouter au Panier"

# ── Aller sur l'onglet Panier ────────────────────────────────────
- tapOn: "Panier"

# ── Vérifier que le produit est dans le panier ──────────────────
- assertVisible: "Sous-total"
- assertVisible: "Commander"
- assertNotVisible: "Panier vide"

# Le total articles doit être > 0 — vérifier l'affichage du total
- assertVisible: "Total"
