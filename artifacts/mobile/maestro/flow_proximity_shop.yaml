appId: com.bardec.app
# ─────────────────────────────────────────────────────────────────
# FLOW 6 — Onglet "Près de moi" : carte + création de boutique
# Formulaire 4 étapes : Informations → Position → Horaires → Photos
# ─────────────────────────────────────────────────────────────────
name: "BARDEC · Boutique de Proximité"
tags:
  - proximity
  - supabase

env:
  SHOP_NAME: "MAESTRO TEST - Épicerie du Quartier"
  SHOP_DESC: "Boutique créée automatiquement par Maestro le 2026-07-31"
  SHOP_ADDRESS: "12 Rue des Tests, Dakar"
  SHOP_PHONE: "+221 77 111 22 33"

---

- launchApp:
    clearState: false

# ── Onglet Près de moi ──────────────────────────────────────────
- tapOn: "Près de moi"
- assertVisible: "Près de moi"

# Géolocalisation : accorder la permission (dialog système Android)
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"

# Si permission refusée, utiliser le bouton de la page
- runFlow:
    when:
      visible: "Autoriser la géolocalisation"
    commands:
      - tapOn: "Autoriser la géolocalisation"

# Attendre que la carte/liste charge (fallback GPS Dakar automatique)
- assertNotVisible: "Chargement..."

# Le titre "Près de moi" doit rester visible
- assertVisible: "Près de moi"

# ── Ouvrir le formulaire de création de boutique ─────────────────
- tapOn: "Ouvrir ma boutique"

# ── Étape 1 : Informations ───────────────────────────────────────
- assertVisible: "Informations"
- tapOn: "Nom du commerce *"
- inputText: ${SHOP_NAME}

# Sélectionner la catégorie principale (premier chip)
- tapOn:
    index: 0
    text: "Alimentation"

- tapOn: "Description"
- inputText: ${SHOP_DESC}

- tapOn: "Téléphone"
- inputText: ${SHOP_PHONE}

- tapOn: "Adresse (texte)"
- inputText: ${SHOP_ADDRESS}

- tapOn: "Suivant"

# ── Étape 2 : Position (GPS auto-rempli) ────────────────────────
- assertVisible: "Position"
- tapOn: "Suivant"

# ── Étape 3 : Horaires (optionnel) ──────────────────────────────
- assertVisible: "Horaires"
- tapOn: "Suivant"

# ── Étape 4 : Photos (optionnel) → Soumettre ────────────────────
- assertVisible: "Photos"
- tapOn: "Créer ma boutique"

# Vérifier la confirmation
- assertVisible:
    text: "MAESTRO TEST"
